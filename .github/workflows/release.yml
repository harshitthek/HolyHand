name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/HolyHand.sln

      - name: Run unit tests
        run: dotnet test windows/HolyHand.sln --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish HolyHand.App (win-x64 self-contained)
        run: >
          dotnet publish windows/src/HolyHand.App/HolyHand.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/HolyHand-win-x64

      - name: Publish HolyHand.Cli (win-x64 self-contained)
        run: >
          dotnet publish windows/src/HolyHand.Cli/HolyHand.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -o release-pkg/HolyHand-win-x64

      - name: Bundle distribution files
        shell: pwsh
        run: |
          Copy-Item -Path ".env.example" -Destination "release-pkg/HolyHand-win-x64/.env.example"
          Copy-Item -Path "windows/packaging/*" -Destination "release-pkg/HolyHand-win-x64/" -Force
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          Compress-Archive -Path "release-pkg/HolyHand-win-x64/*" -DestinationPath "HolyHand-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: HolyHand-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
